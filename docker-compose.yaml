services:
  db:
    build:
      context: ./database
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_db_user_password
      MIGRATIONS_DB_USER_PASSWORD_FILE: /run/secrets/migrations_db_user_password
      INTERFACE_DB_USER_PASSWORD_FILE: /run/secrets/interface_db_user_password
      SEED_DB_USER_PASSWORD_FILE: /run/secrets/seed_db_user_password
      FRONTEND_DB_USER_PASSWORD_FILE: /run/secrets/frontend_db_user_password
      ORCHESTRATOR_DB_USER_PASSWORD_FILE: /run/secrets/orchestrator_db_user_password
    volumes:
      - ./database/data:/var/lib/postgresql
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - pantheon
    container_name: db
    secrets:
      - postgres_db_user_password
      - migrations_db_user_password
      - interface_db_user_password
      - frontend_db_user_password
      - orchestrator_db_user_password

  db-migrations:
    build:
      context: ./db-migrations
      args:
        MIGRATIONS_DB_USER: migrations_db_user
    env_file:
      - path: .env
        required: true
    environment:
      MIGRATIONS_DB_USER_PASSWORD_FILE: /run/secrets/migrations_db_user_password
    networks:
      - pantheon
    depends_on:
      db:
        condition: service_healthy
    container_name: db-m
    secrets:
      - migrations_db_user_password

  db-seed:
    build:
      context: ./db-seed
    env_file:
      - path: .env
        required: true
    environment:
      SEED_DB_USER_PASSWORD_FILE: /run/secrets/seed_db_user_password
    networks:
      - pantheon
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    container_name: db-s
    secrets:
      - seed_db_user_password

  db-interface:
    build:
      context: ./db-interface
    env_file:
      - path: .env
        required: true
    environment:
      INTERFACE_DB_USER_PASSWORD_FILE: /run/secrets/interface_db_user_password
      PGRST_DB_SCHEMAS: app_schema
      PGRST_DB_EXTRA_SEARCH_PATH: app_schema
      PGRST_DB_ANON_ROLE: interface_db_user
    container_name: db-if
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    ports:
      - ${PGRST_SERVER_PORT}:${PGRST_SERVER_PORT}
      - ${PGRST_ADMIN_SERVER_PORT}:${PGRST_ADMIN_SERVER_PORT}
    networks:
      - pantheon
    secrets:
      - interface_db_user_password

  frontend:
    build:
      context: ./frontend
    env_file:
      - path: .env
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/frontend_db_user_password
    container_name: fe
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${GRAFANA_PORT}:3000
    networks:
      - pantheon
    volumes:
      - ./frontend/data:/var/lib/grafana
    secrets:
      - frontend_db_user_password

  dagster_user_code:
    build:
      context: ./orchestrator
      dockerfile: ./Dockerfile_user_code
    env_file:
      - path: .env
        required: true
    environment:
      DAGSTER_POSTGRES_PASSWORD_FILE: /run/secrets/orchestrator_db_user_password
      DAGSTER_POSTGRES_HOST: ${POSTGRES_HOST}
    container_name: dg_uc
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    ports:
      - ${DAGSTER_UC_PORT}:${DAGSTER_UC_PORT}
    networks:
      - pantheon
    secrets:
      - orchestrator_db_user_password

  dagster_webserver:
    build:
      context: ./orchestrator
      dockerfile: ./Dockerfile_dagster_webserver
    env_file:
      - path: .env
        required: true
    environment:
      DAGSTER_POSTGRES_PASSWORD_FILE: /run/secrets/orchestrator_db_user_password
      DAGSTER_POSTGRES_HOST: ${POSTGRES_HOST}
    container_name: dg_ws
    depends_on:
      dagster_user_code:
        condition: service_healthy
    ports:
      - ${DAGSTER_WS_PORT}:${DAGSTER_WS_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - pantheon
    secrets:
      - orchestrator_db_user_password

  dagster_daemon:
    build:
      context: ./orchestrator
      dockerfile: ./Dockerfile_dagster_daemon
    env_file:
      - path: .env
        required: true
    environment:
      DAGSTER_POSTGRES_PASSWORD_FILE: /run/secrets/orchestrator_db_user_password
      DAGSTER_POSTGRES_HOST: ${POSTGRES_HOST}
    container_name: dg_d
    depends_on:
      dagster_user_code:
        condition: service_healthy
    restart: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/io_manager_storage:/tmp/io_manager_storage
    networks:
      - pantheon
    secrets:
      - orchestrator_db_user_password

networks:
  pantheon:
    name: pantheon

secrets:
  postgres_db_user_password:
    file: ./secrets/postgres_db_user_password.txt
  migrations_db_user_password:
    file: ./secrets/migrations_db_user_password.txt
  seed_db_user_password:
    file: ./secrets/seed_db_user_password.txt
  interface_db_user_password:
    file: ./secrets/interface_db_user_password.txt
  frontend_db_user_password:
    file: ./secrets/frontend_db_user_password.txt
  orchestrator_db_user_password:
    file: ./secrets/orchestrator_db_user_password.txt
