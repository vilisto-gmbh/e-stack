services:
  base_service:
    env_file:
      - path: .env
        required: true
    build:
      args:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_PORT: ${POSTGRES_PORT}
        POSTGRES_DB: ${POSTGRES_DB}
        DB_USER: ${DB_USER}
        DB_USER_PASSWORD: ${DB_USER_PASSWORD}
        POSTGRES_HOST: ${POSTGRES_HOST}
        SCHEMA_NAME: ${SCHEMA_NAME}
        PGRST_DB_URI: postgresql://${DB_USER}:${DB_USER_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
        PGRST_ADMIN_SERVER_PORT: ${PGRST_ADMIN_SERVER_PORT}
        PGRST_SERVER_PORT: ${PGRST_SERVER_PORT}
        PGRST_DB_SCHEMA: =${SCHEMA_NAME}
        PGRST_DB_EXTRA_SEARCH_PAT: =${SCHEMA_NAME}
        PGRST_DB_ANON_ROL: =${DB_USER}
    networks:
      - pantheon