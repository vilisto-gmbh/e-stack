[project]
name = "orchestrator"
version = "0.1.0"
description = "python code for project jobs orchestrated via dagster"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.15",
]

[dependency-groups]
dagster-rpc = [
    "dagster-docker>=0.29.15",
    "dagster-postgres>=0.29.15",
]
dagster-services = [
    "dagster-graphql>=1.13.15",
    "dagster-webserver>=1.13.15",
]

