[project]
name = "orchestrator"
version = "0.1.0"
description = "python code for dagster orchestrated project jobs"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.15",
]

[dependency-groups]
dev = ["dagster-dg-cli"]
dagster-rpc = [
    "dagster-docker>=0.29.15",
    "dagster-postgres>=0.29.15",
]
dagster-services = [
    "dagster-graphql>=1.13.15",
    "dagster-webserver>=1.13.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrator"
registry_modules = [
    "orchestrator.components.*",
]
code_location_name = "orchestrator"
