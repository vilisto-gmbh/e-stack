apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: app_postgres # referenced by the dashboard JSON
    type: postgres
    access: proxy
    url: db:5432
    user: frontend_db_user
    isDefault: true
    jsonData:
      database: app_db
      sslmode: disable
      postgresVersion: 1300
      timescaledb: false
    secureJsonData:
      password: $__file{/run/secrets/frontend_db_user_password}
